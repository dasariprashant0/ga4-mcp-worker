# Deploy ga4-mcp-worker to Cloudflare.
#
# Typecheck and a bundle dry-run must pass before anything deploys. This repo
# has no unit tests; if that changes, add them to the verify job so they gate
# the deploy too.
#
# Requires one repository secret: CLOUDFLARE_API_TOKEN
#   Cloudflare dashboard -> My Profile -> API Tokens -> Create Token
#   -> "Edit Cloudflare Workers" template, scoped to this account.
#   Then: gh secret set CLOUDFLARE_API_TOKEN --repo dasariprashant0/ga4-mcp-worker
#   Without the secret the deploy job skips itself, so forks and this public copy stay green.
#   Optional: a repository variable WORKER_URL (https://<name>.<subdomain>.workers.dev)
#   enables the post-deploy health check.
#
# The same token works for both this repo and gtm-mcp-worker.

name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Bundle (dry run)
        run: npm run dry-run

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check for a Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CLOUDFLARE_API_TOKEN secret is set, so nothing deploys from this run."
          fi
      - uses: cloudflare/wrangler-action@v3
        if: steps.token.outputs.present == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env=""
      - name: Confirm the deployed Worker is healthy
        if: steps.token.outputs.present == 'true' && vars.WORKER_URL != ''
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          sleep 5
          curl -sSf "$WORKER_URL/health" | tee /dev/stderr | grep -q '"status":"ok"'
